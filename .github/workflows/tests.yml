name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the documented floor (zoneinfo); 3.13 is what most hosts run.
        python-version: ["3.9", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        # No install step: the project has no dependencies.
        run: python -m unittest discover -s tests -t . -v

      - name: Check the modules import cleanly
        run: python -c "import app, greek, report, sources; print('version', app.__version__)"
