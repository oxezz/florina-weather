on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the documented floor: 3.9 is end-of-life and gets no further
        # security fixes. 3.13 is what the host runs; 3.14 is current.
        python-version: ["3.10", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        # No install step: the project has no dependencies.
        run: python -m unittest discover -s tests -t . -v

      - name: Check the modules import cleanly
        run: python -c "import app, greek, report, sources; print('version', app.__version__)"
