<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Square, full-bleed variant of favicon.svg.
       Used for the maskable Android icon and the iOS home-screen icon, both of
       which composite the artwork onto an opaque tile — a rounded, transparent
       PNG would come out with black corners.

       The artwork fits inside the maskable safe zone (a centred circle of 80%
       diameter) with room to spare: its furthest point from centre is ~24.5
       units against a radius of 25.6. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2f7fd0"/>
      <stop offset="100%" stop-color="#0c2339"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" fill="url(#sky)"/>
  <circle cx="25" cy="24" r="11" fill="url(#sun)"/>
  <path d="M22 46a9 9 0 0 1 .9-17.9 12 12 0 0 1 22.4 3.4A8 8 0 0 1 44 46z"
        fill="#f2f7ff" opacity="0.95"/>
  <path d="M22 46a9 9 0 0 1 .9-17.9 12 12 0 0 1 22.4 3.4A8 8 0 0 1 44 46z"
        fill="none" stroke="rgba(12,35,57,.25)" stroke-width="1.2"/>
</svg>
